<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WashGo - Lavado de Autos a Domicilio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#f5f7fa;color:#333}
header{background:linear-gradient(135deg,#00b4db,#0083b0);color:#fff;padding:20px 8%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:bold}
nav a{color:#fff;text-decoration:none;margin-left:20px}
.hero{min-height:90vh;display:flex;align-items:center;justify-content:space-between;padding:0 8%;background:linear-gradient(to right,#e3f2fd,#fff)}
.hero-text{max-width:500px}
.hero h1{font-size:55px;color:#0083b0;margin-bottom:20px}
.btn{background:#00b4db;color:#fff;padding:15px 30px;border-radius:30px;text-decoration:none}
.services,.contact{padding:80px 8%;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px}
.card{background:#fff;padding:30px;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
.contact{background:#0083b0;color:white}
footer{background:#005f7a;color:#fff;text-align:center;padding:20px}
</style>
</head>
<body>
<header><div class="logo">🚗 WashGo</div></header>
<section class="hero">
<div class="hero-text">
<h1>Lavado de Autos a Domicilio</h1>
<p>Tu auto limpio sin salir de casa.</p>
<a href="#contacto" class="btn">Agenda tu lavado</a>
</div>
</section>
<section class="services">
<h2>Nuestros Servicios</h2>
<div class="cards">
<div class="card"><h3>Lavado Básico</h3></div>
<div class="card"><h3>Lavado Premium</h3></div>
<div class="card"><h3>Encerado</h3></div>
<div class="card"><h3>Detallado Completo</h3></div>
</div>
</section>
<section id="contacto" class="contact">
<h2>Solicita tu Servicio</h2>
</section>
<footer>© 2026 WashGo</footer>
</body>
</html>
